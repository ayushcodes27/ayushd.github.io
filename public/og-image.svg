<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c10" />
      <stop offset="100%" stop-color="#111620" />
    </linearGradient>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow -->
    <radialGradient id="cyanGlow" cx="15%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Dot Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#dotPattern)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#cyanGlow)" />

  <!-- Outer Hairline Border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />

  <!-- Top Bar: Monogram + Domain + Status Badge -->
  <g transform="translate(72, 72)">
    <!-- Monogram Circle -->
    <circle cx="24" cy="24" r="24" fill="#ffffff" />
    <text x="24" y="31" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="900" font-size="18" fill="#0a0c10" text-anchor="middle">AD</text>

    <!-- Domain -->
    <text x="64" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="22" fill="#ffffff" letter-spacing="-0.5">ayushd.me</text>

    <!-- Status Pill (Far Right) -->
    <g transform="translate(850, 4)">
      <rect x="0" y="0" width="206" height="38" rx="19" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.2" />
      <circle cx="22" cy="19" r="4.5" fill="#10b981" />
      <text x="36" y="24" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#34d399" letter-spacing="1">OPEN FOR SWE ROLES</text>
    </g>
  </g>

  <!-- Middle Hero: Tagline, Big Name, Bio -->
  <g transform="translate(72, 220)">
    <!-- Tagline -->
    <text x="0" y="0" font-family="'JetBrains Mono', monospace, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#10b981" letter-spacing="2.5">● BACKEND &amp; SYSTEMS ENGINEER</text>

    <!-- Headline -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Space Grotesk', sans-serif" font-size="68" font-weight="900" fill="#ffffff" letter-spacing="-2">AYUSH DEORE</text>

    <!-- Bio / Value Proposition -->
    <text x="0" y="126" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="23" font-weight="400" fill="#94a3b8">
      Building scalable event-driven engines, distributed financial ledgers,
    </text>
    <text x="0" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="23" font-weight="400" fill="#94a3b8">
      and production-grade multi-agent AI verification pipelines.
    </text>
  </g>

  <!-- Bottom Divider Line -->
  <line x1="72" y1="500" x2="1128" y2="500" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1" />

  <!-- Bottom Bar: Tech Stack & Profiles -->
  <g transform="translate(72, 532)">
    <!-- Tech Stack Pills -->
    <g>
      <rect x="0" y="0" width="82" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="41" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Java 21</text>
    </g>
    <g transform="translate(92, 0)">
      <rect x="0" y="0" width="112" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="56" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Spring Boot</text>
    </g>
    <g transform="translate(214, 0)">
      <rect x="0" y="0" width="70" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="35" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Kafka</text>
    </g>
    <g transform="translate(294, 0)">
      <rect x="0" y="0" width="68" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="34" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Redis</text>
    </g>
    <g transform="translate(372, 0)">
      <rect x="0" y="0" width="80" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="40" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Python</text>
    </g>
    <g transform="translate(462, 0)">
      <rect x="0" y="0" width="105" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="52" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">LangGraph</text>
    </g>
    <g transform="translate(577, 0)">
      <rect x="0" y="0" width="105" height="32" rx="7" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="52" y="21" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">PostgreSQL</text>
    </g>

    <!-- Handle (Far Right) -->
    <text x="1056" y="22" font-family="'JetBrains Mono', monospace, sans-serif" font-size="14" font-weight="600" fill="#64748b" text-anchor="end">github.com/ayushcodes27</text>
  </g>
</svg>
